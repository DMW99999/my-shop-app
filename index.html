<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазины</title>
    <style>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И СБРОС --- */
        :root {
            --accent-blue: #2A8BF3;
            --border-gray: #E0E0E0;
            --bg-light: #F5F5F5;
            --text-dark: #212121;
            --text-medium: #757575;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #f9f9f9; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* --- ОБОЛОЧКА ЭКРАНА --- */
        .screen { 
            display: none; 
            height: calc(100vh - 56px); /* Высота окна минус высота футера */
            overflow-y: auto; 
            padding: 16px; 
        }
        .active { display: flex !important; flex-direction: column; }

        /* --- ХЕДЕР --- */
        header { 
            text-align: center; 
            padding: 15px 0; 
            background: #121212; 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 16px;
         }
        h1 { margin: 0; font-size: 18px; letter-spacing: 0.5px; }
        button.back-btn { 
            background: none; border: none; color: white; font-size: 24px; cursor: pointer; width: 40px; 
         }

        /* --- КОНТЕНТ БЛОКИ --- */
        .ad-grid { 
            display: grid; 
            gap: 8px; 
            padding: 16px 0; 
            margin-bottom: 20px;
            grid-template-columns: repeat(2, 1fr); /* Два баннера в ряд */
         }
        .ad-block { 
            background: #f5f5f5; 
            padding: 16px; 
            border-radius: 8px; 
            text-align: center; 
            color: #757575; 
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
         }
         
        /* Список магазинов */
        .shop-item { 
            padding: 15px; 
            border-bottom: 1px solid var(--border-gray);
            display: flex;
            align-items: center;
         }
        .logo-box { 
            width: 40px; 
            height: 40px; 
            background: #ddd; 
            border-radius: 8px; 
            margin-right: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #555; 
            font-weight: bold; 
            font-size: 16px;
         }
        .shop-info { line-height: 1.4; }
        .shop-name { font-weight: bold; font-size: 16px; color: #212121; display: block; }
        .shop-address { font-size: 13px; color: #757575; }

        /* Нижняя навигация */
        .footer-nav { 
            display: flex; 
            justify-content: space-around; 
            background: white; 
            padding: 16px; 
            border-top: 1px solid #E0E0E0; 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            z-index: 10;
         }
        .role-btn { 
            flex: 1; 
            padding: 12px; 
            background: #FFFFFF; 
            color: #757575; 
            border: 1px solid #E0E0E0; 
            border-radius: 8px; 
            font-size: 14px; 
            cursor: pointer; 
            transition: opacity 0.2s; 
            text-transform: uppercase;
         }
        .btn-active { 
            background-color: #2A8BF3; 
            color: white; 
            border-color: #2A8BF3; 
         }
         
        /* Форма регистрации */
        .form-wrapper { max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; min-height: 100px; }
        .submit-btn { width: 100%; padding: 14px; background-color: #2A8BF3; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <header><h1>МАГАЗИНЫ</h1></header>
        
        <div class="content">

                <div class="ad-block">Баннер 4</div>
                <div class="ad-block">Баннер 5</div>
                <div class="ad-block">Баннер 6</div>
            </div>

            <!-- Список магазинов -->
            <div
