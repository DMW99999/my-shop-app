<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазины</title>
    <style>
        /* --- 1. ГЛОБАЛЬНЫЕ ПРАВИЛА --- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; background:#f0f2f5; height: 100vh; margin:0; position: relative; }
        
        /* Экран-обертка с жесткими размерами */
        .screen {
            width: 100%; 
            height: 100vh;
            display: none; 
            flex-direction: column;
            position: relative;
        }
        .active { display: flex !important; }

        /* --- 2. ФИКСИРОВАННЫЕ ЭЛЕМЕНТЫ ПО КООРДИНАТАМ --- */
        
        /* Хедер сверху - зафиксирован */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background-color: #121212;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        h1 { font-size: 18px; letter-spacing: 0.5px; }
        button.back-btn { background:none; border:none; color:white; font-size:24px; cursor:pointer; }

        /* Нижняя панель навигации - зафиксирована снизу */
        footer.nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }
        .nav-btn {
            text-align: center;
            color: #757575;
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
        }
        .nav-btn.active { 
            color: #2A8BF3; 
            font-weight: bold; 
        }
        .nav-icon { font-size: 24px; display: block; margin-bottom: 2px; }

        /* Контентная область (между хедером и футером) */
        .page-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-top: 80px; /* Отступ под хедер */
            padding-bottom: 80px; /* Отступ под футер */
        }

        /* Баннеры */
        .ad-grid { 
            display: grid; 
            gap: 10px; 
            margin-bottom: 20px;
            grid-template-columns: repeat(2, 1fr); /* Два баннера в ряд */
        }
        .ad-block { 
            background: #f5f5f5; 
            border-radius: 8px; 
            padding: 20px; 
            min-height: 60px; 
            display:flex; align-items:center; justify-content:center;
         }

        /* Карточка магазина */
        .shop-item { 
            padding: 15px 0; 
            border-bottom: 1px solid #eee; 
            display: flex; 
            align-items: center; 
        }
